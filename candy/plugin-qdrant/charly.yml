plugin-qdrant:
    candy:
        description: |-
            The `charly qdrant` CLI for a deployed Qdrant vector-search server PLUS
            the declarative `qdrant:` check verb — an out-of-tree EXTERNAL plugin
            (composed into projects via the
            `@github.com/opencharly/plugin-qdrant/candy/plugin-qdrant` candy ref and
            connected out-of-process by word at runtime; no charly-module import).

            The command drives the server through the OFFICIAL Go client
            (github.com/qdrant/go-client, gRPC on 6334) for
            collections/points/snapshots/health and the REST API only for
            telemetry/metrics: `charly qdrant version|health`, `collections
            list|create|info|exists|delete`, `points upsert|query|scroll|count|get|delete`,
            `snapshots list|create|delete`. Endpoint resolution is deliberately
            lightweight: --host/--api-key flags > QDRANT_HOST / QDRANT_API_KEY env >
            http://127.0.0.1:6333 (REST) with gRPC on 6334.

            The `qdrant:` check verb is the declarative counterpart, authored as a
            `check:` step (`qdrant: health`, `collections-list`, `points-upsert`, …).
            It is HOST-BASED (the herdr pattern): it resolves the in-venue
            REST/gRPC ports to a host-routable address over the reverse channel and
            drives the SAME Go client (R3 — one protocol surface covers the CLI and
            every bed), reading the admin key host-side from the credential store
            (charly/api-key/qdrant) over verb:credential. The full method surface —
            health, version, auth boundary, collection CRUD, point
            upsert/query/scroll/count/get/delete, and snapshots — lets a candy/box
            `check:` plan FULLY configure and exercise a Qdrant instance from
            charly.yml alone. Every method skips under `charly check box` (no
            running server on a disposable `podman run --rm`).
        plugin:
            providers:
                - command:qdrant
                - verb:qdrant
            source: github.com/opencharly/plugin-qdrant/candy/plugin-qdrant
            primary:
                qdrant: method
        plan:
            - # ADE check: a deterministic build-context check that does NOT depend
              # on a live qdrant server the CLI/verb need. Mirrors plugin-herdr /
              # plugin-ollama — a build-context `command` check running `true`. The
              # full CLI + verb end-to-end is exercised by the Go unit tests, the
              # live client integration test (live-or-skip), and the
              # check-qdrant-pod R10 bed.
              check: the command:qdrant + verb:qdrant plugin ships a buildable Go module the host compiles and the qdrant command tree dispatches; the full surface is exercised by the Go tests + the check-qdrant-pod bed
              id: qdrant-module-present
              context:
                - build
              command: "true"
qdrant-cli-skill:
    skill:
        name: qdrant-cli
        family: qdrant
        owner: plugin-qdrant
        description: |-
            The `charly qdrant` management CLI for a deployed Qdrant
            vector-search server PLUS the declarative `qdrant:` check verb
            (command:qdrant + verb:qdrant plugin, plugin-qdrant). MUST be invoked
            before managing collections, points, or snapshots on a running Qdrant
            deployment from the host, or before authoring/verifying a qdrant check
            bed.
        triggers:
            - "`charly qdrant` CLI (collections / points / snapshots / health / version) / the `qdrant:` check verb / the check-qdrant-pod bed / the qdrant box"
